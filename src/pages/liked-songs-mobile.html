<!-- Injected into .app-container in home-mobile.html -->

<body>
    <div class="liked-songs-page-wrapper">
        <!-- Top Sticky Header -->
        <header class="liked-songs-header" id="likedSongsHeader">
            <button id="likedSongsBackBtn" class="liked-songs-back-btn" type="button" aria-label="Back to Library">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>

            <!-- Center Status Floating Badge -->
            <div class="liked-songs-status-badge" id="likedSongsStatusBadge">
                <span class="liked-pulse-dot" aria-hidden="true"></span>
                <span class="liked-status-label">Favorites Sanctuary</span>
            </div>

            <button id="likedSongsMoreBtn" class="liked-songs-more-btn" type="button" aria-label="Liked songs options">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <circle cx="12" cy="5" r="1.75" />
                    <circle cx="12" cy="12" r="1.75" />
                    <circle cx="12" cy="19" r="1.75" />
                </svg>
            </button>
        </header>

        <!-- Liked Songs Hero Content Section -->
        <section class="liked-songs-hero" id="likedSongsHero">
            <div class="liked-songs-cover-box">
                <img src="/public/images/Liked%20Image.webp" alt="Liked Songs Cover" class="liked-songs-cover-img" width="120" height="120"
                    onerror="this.onerror=null; this.src='../../public/images/Liked%20Image.webp';">
                <div class="liked-songs-cover-glow" aria-hidden="true"></div>
            </div>
            <div class="liked-songs-meta">
                <div class="liked-songs-category-tag">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span>FAVORITES COLLECTION</span>
                </div>
                <h1 class="liked-songs-title">Liked Songs</h1>
                <div class="liked-songs-stats-row">
                    <span class="liked-stat-item" id="likedSongsCount">0 songs</span>
                    <span class="liked-stat-dot">•</span>
                    <span class="liked-stat-item" id="likedSongsDuration">0 min</span>
                    <span class="liked-stat-dot">•</span>
                    <span class="liked-stat-item liked-stat-synced" id="likedSongsSyncStatus">Cloud Synced</span>
                </div>
                <p class="liked-songs-tagline">Your personal music sanctuary. Every track you ever loved, all in one place.</p>
            </div>
        </section>

        <!-- Interactive Collection Insights Card -->
        <section class="liked-songs-insights-card" id="likedSongsInsightsCard" aria-label="Collection Insights">
            <div class="insights-card-header">
                <div class="insights-card-title-group">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" class="insights-icon" aria-hidden="true">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span class="insights-card-label">Collection Insights</span>
                </div>
                <span class="insights-card-badge" id="insightsVibeBadge">Personal Mix</span>
            </div>

            <div class="insights-metrics-grid">
                <div class="insights-metric-box">
                    <span class="insights-metric-label">PLAYTIME</span>
                    <span class="insights-metric-val" id="insightsPlaytimeVal">0m</span>
                </div>
                <div class="insights-metric-box">
                    <span class="insights-metric-label">TOP ARTIST</span>
                    <span class="insights-metric-val" id="insightsTopArtistVal">—</span>
                </div>
                <div class="insights-metric-box">
                    <span class="insights-metric-label">SAVED</span>
                    <span class="insights-metric-val" id="insightsSavedVal">0 tracks</span>
                </div>
            </div>

            <div class="insights-accent-bar" aria-hidden="true"></div>
        </section>

        <!-- Action Controls Bar (Play all, Shuffle, View Switcher) -->
        <div class="liked-songs-actions-bar">
            <button id="likedSongsPlayAllBtn" class="liked-songs-play-all-btn" type="button"
                aria-label="Play all liked songs">
                <span class="btn-icon-wrapper" id="likedPlayIconWrapper">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </span>
                <span class="btn-text" id="likedPlayAllText">Play all</span>
            </button>

            <button id="likedSongsShuffleBtn" class="liked-songs-shuffle-btn" type="button"
                aria-label="Shuffle play liked songs">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="currentColor"
                        d="M2 16.25a.75.75 0 0 0 0 1.5zm8.748-2.163l-.643-.386zm2.504-4.174l.643.386zM22 7l.53.53a.75.75 0 0 0 0-1.06zm-2.53 1.47a.75.75 0 0 0 1.06 1.06zm1.06-4a.75.75 0 1 0-1.06 1.06zm-5.31 2.92l-.369-.653zM2 17.75h3.603v-1.5H2zm9.39-3.277l2.505-4.174l-1.286-.772l-2.504 4.174zm7.007-6.723H22v-1.5h-3.603zm3.073-1.28l-2 2l1.06 1.06l2-2zm1.06 0l-2-2l-1.06 1.06l2 2zm-8.635 3.829c.434-.724.734-1.22 1.006-1.589c.263-.355.468-.543.689-.668l-.739-1.305c-.467.264-.82.627-1.155 1.08c-.326.44-.668 1.011-1.087 1.71zm4.502-4.049c-.815 0-1.48 0-2.025.052c-.562.055-1.054.17-1.521.435l.739 1.305c.22-.125.487-.204.927-.247c.456-.044 1.036-.045 1.88-.045zM5.603 17.75c.815 0 1.48 0 2.025-.052c.562-.055 1.054-.17 1.521-.435l-.739-1.305c-.22.125-.487.204-.927.247c-.456.044-1.036.045-1.88.045zm4.502-4.049c-.435.724-.734 1.22-1.006 1.589c-.263.355-.468.543-.689.668l.74 1.305c.466-.264.819-.627 1.154-1.08c.326-.44.668-1.011 1.087-1.71zM2 6.25a.75.75 0 0 0 0 1.5zM22 17l.53.53a.75.75 0 0 0 0-1.06zm-1.47-2.53a.75.75 0 1 0-1.06 1.06zm-1.06 4a.75.75 0 1 0 1.06 1.06zm-3.345-1.525l.144-.736zm-1.682-2.33a.75.75 0 1 0-1.286.77zm.025 1.391l.558-.501zm-6.593-8.95l.143-.737zm1.682 2.33a.75.75 0 0 0 1.286-.772zm-.025-1.393l-.558.502zM2 7.75h4.668v-1.5H2zm15.332 10H22v-1.5h-4.668zm5.198-1.28l-2-2l-1.06 1.06l2 2zm-1.06 0l-2 2l1.06 1.06l2-2zm-4.138-.22c-.645 0-.867-.003-1.063-.041l-.287 1.472c.372.072.765.069 1.35.069zm-4.175-.864c.3.502.5.84.754 1.122l1.115-1.003c-.134-.149-.25-.337-.583-.89zm3.112.823a2.25 2.25 0 0 1-1.243-.704l-1.115 1.003a3.75 3.75 0 0 0 2.071 1.173zM6.668 7.75c.645 0 .867.003 1.063.041l.287-1.472c-.372-.072-.765-.069-1.35-.069zm4.175.864c-.3-.502-.5-.84-.754-1.122L8.974 8.495c.134.149.25.337.583.89zm-3.112-.823c.48.094.916.34 1.243.704l1.115-1.003a3.75 3.75 0 0 0-2.071-1.173z" />
                </svg>
                <span>Shuffle</span>
            </button>

            <!-- Layout Switcher (List vs Grid) -->
            <div class="liked-songs-view-toggle-group">
                <button type="button" id="likedViewListBtn" class="liked-view-btn is-active"
                    aria-label="List view">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
                <button type="button" id="likedViewGridBtn" class="liked-view-btn" aria-label="Grid view">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Search Box & Filter Chips Section -->
        <div class="liked-songs-filter-section">
            <div class="liked-songs-search-box">
                <svg class="liked-songs-search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                    stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="likedSongsSearchInput" class="liked-songs-search-input"
                    placeholder="Search in Liked Songs..." autocomplete="off" spellcheck="false"
                    aria-label="Search liked songs">
                <button type="button" id="likedSongsSearchClearBtn" class="liked-songs-search-clear-btn hidden"
                    aria-label="Clear search input">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Horizontal Filter Chips -->
            <div class="liked-songs-chips-row" role="tablist" aria-label="Filter liked songs categories">
                <button type="button" class="liked-chip is-active" data-filter="all">All</button>
                <button type="button" class="liked-chip" data-filter="tracks">Tracks</button>
                <button type="button" class="liked-chip" data-filter="artists">Artists</button>
                <button type="button" class="liked-chip" data-filter="albums">Albums</button>

                <!-- Sort Dropdown / Cycle Trigger -->
                <button type="button" id="likedSortTriggerBtn" class="liked-sort-btn"
                    aria-label="Sort liked songs">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="6" x2="20" y2="6"></line>
                        <line x1="4" y1="12" x2="14" y2="12"></line>
                        <line x1="4" y1="18" x2="8" y2="18"></line>
                    </svg>
                    <span id="likedSortLabel">Recent</span>
                </button>
            </div>
        </div>

        <!-- Liked Songs Data List / Grid Section -->
        <section class="liked-songs-list-section">
            <div id="likedSongsList" class="liked-songs-list view-list">
                <!-- Skeletons rendered initially by JS or fallback -->
                <div class="liked-song-skeleton skeleton">
                    <div class="skeleton-art"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line-title"></div>
                        <div class="skeleton-line-sub"></div>
                    </div>
                    <div class="skeleton-actions"></div>
                </div>
                <div class="liked-song-skeleton skeleton">
                    <div class="skeleton-art"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line-title"></div>
                        <div class="skeleton-line-sub"></div>
                    </div>
                    <div class="skeleton-actions"></div>
                </div>
                <div class="liked-song-skeleton skeleton">
                    <div class="skeleton-art"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line-title"></div>
                        <div class="skeleton-line-sub"></div>
                    </div>
                    <div class="skeleton-actions"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Global Liked Songs Options Bottom Sheet Modal -->
    <div id="likedSongsOptionsModal" class="liked-songs-options-modal hidden" inert>
        <div class="liked-songs-options-backdrop" id="likedSongsOptionsBackdrop"></div>
        <div class="liked-songs-options-sheet" id="likedSongsOptionsSheet">
            <div class="liked-songs-options-handle-wrapper" id="likedSongsOptionsHandleWrapper">
                <div class="liked-songs-options-handle"></div>
            </div>
            <div class="liked-songs-options-header">
                <img src="/public/images/Liked%20Image.webp" alt="Liked Songs" class="liked-songs-options-photo" width="48" height="48"
                    onerror="this.onerror=null; this.src='../../public/images/Liked%20Image.webp';">
                <div class="liked-songs-options-info">
                    <h3 class="liked-songs-options-name">Liked Songs Collection</h3>
                    <p class="liked-songs-options-sub" id="likedSongsOptionsCount">0 songs</p>
                </div>
            </div>
            <div class="liked-songs-options-list">
                <button type="button" class="liked-songs-option-item" id="optLikedSortRecent">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Sort by Recently Liked</span>
                </button>
                <button type="button" class="liked-songs-option-item" id="optLikedSortAlpha">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19h6"></path>
                        <path d="M4 5h6"></path>
                        <path d="M14 5l6 14"></path>
                        <path d="M16 14h4"></path>
                    </svg>
                    <span>Sort by Title (A - Z)</span>
                </button>
                <button type="button" class="liked-songs-option-item" id="optLikedSortArtist">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Sort by Artist (A - Z)</span>
                </button>
                <button type="button" class="liked-songs-option-item" id="optLikedSortDuration">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 14 10"></polyline>
                    </svg>
                    <span>Sort by Duration (Longest first)</span>
                </button>
                <button type="button" class="liked-songs-option-item" id="likedOptShareAction">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                    <span>Share Liked Songs</span>
                </button>
            </div>
            <button type="button" class="liked-songs-options-close-btn" id="likedSongsOptionsCloseBtn">Cancel</button>
        </div>
    </div>

    <!-- Per-Song Options Bottom Sheet Modal -->
    <div id="likedSongItemOptionsModal" class="liked-songs-options-modal hidden" inert>
        <div class="liked-songs-options-backdrop" id="likedSongItemBackdrop"></div>
        <div class="liked-songs-options-sheet" id="likedSongItemSheet">
            <div class="liked-songs-options-handle-wrapper">
                <div class="liked-songs-options-handle"></div>
            </div>
            <div class="liked-songs-options-header">
                <img id="likedSongOptionsCover" src="/public/images/Liked%20Image.webp" alt="Track Cover"
                    class="liked-songs-options-photo" width="48" height="48">
                <div class="liked-songs-options-info">
                    <h3 class="liked-songs-options-name" id="likedSongOptionsTitle">Track Title</h3>
                    <p class="liked-songs-options-sub" id="likedSongOptionsArtist">Artist Name</p>
                </div>
            </div>
            <div class="liked-songs-options-list">
                <button type="button" class="liked-songs-option-item" id="optLikedSongPlayNext">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                    <span>Play Next in Queue</span>
                </button>
                <button type="button" class="liked-songs-option-item" id="optLikedSongDownload">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Save for Offline Playback</span>
                </button>
                <button type="button" class="liked-songs-option-item item-danger" id="optLikedSongRemove">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2.2"></line>
                    </svg>
                    <span>Remove from Liked Songs</span>
                </button>
            </div>
            <button type="button" class="liked-songs-options-close-btn" id="likedSongItemCloseBtn">Cancel</button>
        </div>
    </div>
</body>
